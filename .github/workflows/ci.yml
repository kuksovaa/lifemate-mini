name: LifeMate CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --locked --dev

      - name: Run tests
        run: |
          mkdir -p reports
          uv run --locked python -m pytest -v --junitxml=reports/pytest-results.xml

      - name: Upload LifeMate artifact
        uses: actions/upload-artifact@v7
        with:
          name: lifemate-artifact
          path: |
            app_final.py
            test_app.py
            requirements.txt
            requirements-dev.txt
            README.md
            reports/pytest-results.xml
          if-no-files-found: error